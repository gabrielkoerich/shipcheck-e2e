runner = "host"

[host]
versions = []

[host.checks]
lint = "test -f README.md && ! grep -n '	' README.md"
test = "grep -n shipcheck README.md && echo found it"
build = "mkdir -p out && cp README.md out/README.md && test -s out/README.md"
docs = "head -1 README.md | grep -q '^# '"
big = "seq 1 500 | sed 's/^/output line /'"
